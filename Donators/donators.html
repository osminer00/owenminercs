	<body id="top" class="site-card-ui bubble-theme bubble-theme--socials" style="zoom: 95%">
				<div class="bubble-bg" aria-hidden="true">
			<div class="bubble-bg__media">
				<video
					id="bubble-bg-video"
					class="bubble-bg__video"
					autoplay
					muted
					loop
					playsinline

				</video>
			</div>

		</div>
<shared-header></shared-header>

		<div class="container donators-page">
			<div class="intro">
				<div
					class="gallery keep-board-intro"
					style="border: solid black; border-radius: 7px; box-shadow: 5px 5px black"
				>
					<h1>Donators and supporters</h1>
					<p class="donators-hub__tagline">Huge thanks to everyone who has supported the content.</p>
				</div>
				<nav class="donators-support-icons" aria-label="Support and tips">
					<a
						class="donators-support-hero donators-support-hero--kofi"
						href="https://ko-fi.com/owenminer"
						data-hero-cursor-tooltip="Donate here to support future projects"
						data-kofi-link
						target="_blank"
						rel="noopener noreferrer"
					>
						<img
							class="donators-support-hero__art"
							src="images/rainbow-mug-kofi.gif"
							width="120"
							height="120"
							alt=""
							decoding="async"
						/>
						<span class="donators-support-hero__label">Ko-fi</span>
					</a>
					<a
						class="donators-support-hero"
						href="https://streamelements.com/owenminercs/tip"
						data-hero-cursor-tooltip="Donate here to have a message on YouTube and Twitch livestreams"
						data-streamelements-tip-link
						target="_blank"
						rel="noopener noreferrer"
					>
						<img
							class="donators-support-hero__art donators-support-hero__art--motion"
							src="images/live-stream-tip.svg"
							width="120"
							height="120"
							alt=""
							decoding="async"
						/>
						<span class="donators-support-hero__label">StreamElements</span>
					</a>
					<a
						class="donators-support-hero"
						href="https://steamcommunity.com/tradeoffer/new/?partner=169362392&amp;token=P_48mib_"
						data-hero-cursor-tooltip="Send Graphiti's So I Can Draw Pretty Pictures Please"
						data-steam-trade-link
						target="_blank"
						rel="noopener noreferrer"
					>
						<img
							class="donators-support-hero__art donators-support-hero__art--motion donators-support-hero__art--steam"
							src="images/steam.svg"
							width="120"
							height="120"
							alt=""
							decoding="async"
						/>
						<span class="donators-support-hero__label">Steam trade</span>
					</a>
				</nav>
			</div>

			<section class="hub-content-panel" aria-label="Supporter wall">
				<div class="donators-body">
					<p id="donators-error" class="donators-error" hidden>
						Could not load supporter data. Check that <code>Donators/donators.json</code> is present.
					</p>

					<div id="donators-summary" class="donators-summary" aria-live="polite"></div>
					<div id="donators-list" class="donators-grid" aria-live="polite"></div>
				</div>
			</section>
		</div>

		<shared-footer
			disclosure="<i>This page acknowledges community support. No paid shopping links are required for a mention here.</i>"
		></shared-footer>

		<script src="../scripts/donators.js" data-source="donators.json"></script>
