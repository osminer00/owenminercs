			.site-search-page-input {

				color: #fff;

				gap: 0.8rem;
				list-style: none;
				margin: 0;

			.site-search-results__item {

				border-radius: 18px;
				padding: 1rem;
				text-align: left;

			.site-search-results__link {
				color: #b0ff4c;
				display: inline-block;
				font-weight: 800;
				margin-bottom: 0.35rem;
			}

			.site-search-results__snippet,
			.site-search-results__empty,
